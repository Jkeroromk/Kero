<!doctype html><html><head><style>html,body{margin:0;padding:0;background:#000}</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3b3c41"/>
      <stop offset="0.55" stop-color="#232427"/>
      <stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barrel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b1d"/>
      <stop offset="0.45" stop-color="#4a4b51"/>
      <stop offset="1" stop-color="#151517"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="brush" width="1024" height="4" patternUnits="userSpaceOnUse">
      <rect width="1024" height="1" y="0" fill="#ffffff" opacity="0.025"/>
      <rect width="1024" height="1" y="2" fill="#000000" opacity="0.05"/>
    </pattern>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9ffd0"/>
      <stop offset="0.45" stop-color="#4cf08a"/>
      <stop offset="1" stop-color="#4cf08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <!-- shell -->
  <rect width="1024" height="1024" fill="url(#body)"/>
  <rect width="1024" height="1024" fill="url(#brush)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- raised panel -->
  <rect x="96" y="96" width="832" height="832" rx="150" fill="none" stroke="url(#bevel)" stroke-width="5"/>

  <!-- engraved ring -->
  <circle cx="512" cy="512" r="232" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="16"/>
  <circle cx="512" cy="515" r="232" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="10"/>
  <circle cx="512" cy="512" r="196" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="4"/>

  <!-- K monogram: engraved (dark groove + light lower lip) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="58" transform="translate(0,5)">
      <path d="M440 392 V632"/>
      <path d="M592 392 L462 518 L600 632"/>
    </g>
    <g stroke="#0d0d0e" stroke-width="58">
      <path d="M440 392 V632"/>
      <path d="M592 392 L462 518 L600 632"/>
    </g>
    <g stroke="#e4e4e9" stroke-width="40">
      <path d="M440 392 V632"/>
      <path d="M592 392 L462 518 L600 632"/>
    </g>
  </g>

  <!-- power light -->
  <circle cx="808" cy="850" r="44" fill="url(#led)" opacity="0.85" filter="url(#soft)"/>
  <circle cx="808" cy="850" r="17" fill="#5cf59a"/>
  <circle cx="803" cy="845" r="6" fill="#eafff1" opacity="0.9"/>
</svg>
</body></html>
