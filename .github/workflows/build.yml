name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile (unsigned, iOS device)
    runs-on: xcode-27  # Xcode 27.x / iOS 27.1 SDK: needed for the iPhone Duo inner display
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check engine access
        run: |
          if [ -z "$ENGINE_TOKEN" ]; then
            echo "::warning title=ENGINE_TOKEN missing::Add a repository secret ENGINE_TOKEN (a fine-grained token with read access to Jkeroromk/Kero-Engine) so CI can fetch the engine."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Generate Xcode project
        if: env.SKIP != '1'
        run: |
          brew install xcodegen
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          xcodebuild -version
          # Xcode 27 ships the Metal toolchain separately; the engine's shaders need it.
          xcodebuild -downloadComponent MetalToolchain || true
          xcodegen

      # This repo is public, so its Actions logs are too. Only print errors from the app's own
      # sources or from signing/setup; anything from Swift packages (the private engine, mGBA)
      # is counted but not shown. Engine problems show up in Kero-Engine's own CI.
      - name: Build
        if: env.SKIP != '1'
        run: |
          mkdir -p build
          xcodebuild build -project Kero.xcodeproj -scheme Kero -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -scmProvider system CODE_SIGNING_ALLOWED=NO > build/xcodebuild.log 2>&1 || true
          ci/report-errors.sh build/xcodebuild.log "Compiler errors"
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log || { echo "Build failed. Errors from the app are listed above; build locally for the full log."; exit 1; }
