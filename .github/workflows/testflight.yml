name: TestFlight

# Builds, signs and uploads Kero to TestFlight — no Mac needed.
# Run it from the Actions tab (works from the GitHub website on a phone).
#
# Required repository secrets:
#   ENGINE_TOKEN    fine-grained token, Contents: Read on Jkeroromk/Kero-Engine
#   APPLE_TEAM_ID   10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID      App Store Connect API key ID
#   ASC_ISSUER_ID   App Store Connect API issuer ID
#   ASC_KEY_P8      Contents of the AuthKey_XXXX.p8 file (the whole text, including BEGIN/END lines)

on:
  # Pushing to the `testflight` branch also starts an upload.
  push:
    branches: [testflight]
  workflow_dispatch:
    inputs:
      notes:
        description: "What to test (shown in TestFlight)"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive & upload
    runs-on: macos-26
    timeout-minutes: 90
    env:
      ENGINE_TOKEN: ${{ secrets.ENGINE_TOKEN }}
      # Raw values; the first step trims them and exports the clean ones.
      RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      RAW_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      RAW_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          missing=""
          for name in ENGINE_TOKEN RAW_APPLE_TEAM_ID RAW_ASC_KEY_ID RAW_ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing="$missing ${name#RAW_}"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these repository secrets:$missing"
            exit 1
          fi

      - name: Check App Store Connect access
        run: |
          # Strip stray spaces/newlines that sneak in when pasting secrets on a phone.
          export ASC_KEY_ID="$(printf '%s' "$RAW_ASC_KEY_ID" | tr -d '[:space:]')"
          export ASC_ISSUER_ID="$(printf '%s' "$RAW_ASC_ISSUER_ID" | tr -d '[:space:]')"
          export APPLE_TEAM_ID="$(printf '%s' "$RAW_APPLE_TEAM_ID" | tr -d '[:space:]')"
          {
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

          # Shape checks only; values are never printed.
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || echo "::warning title=ASC_KEY_ID::Expected 10 letters/digits, got ${#ASC_KEY_ID} characters."
          [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || echo "::warning title=ASC_ISSUER_ID::Expected a UUID like 69a6de7e-…, got ${#ASC_ISSUER_ID} characters."
          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || echo "::warning title=APPLE_TEAM_ID::Expected 10 letters/digits, got ${#APPLE_TEAM_ID} characters."
          printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY" || echo "::warning title=ASC_KEY_P8::Doesn't contain the BEGIN PRIVATE KEY line."

          # Ask the App Store Connect API directly whether the key works and the app record exists.
          python3 -m pip install --quiet --break-system-packages "pyjwt[crypto]" 2>/dev/null || python3 -m pip install --quiet "pyjwt[crypto]"
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          import jwt
          key = os.environ["ASC_KEY_P8"].strip()
          token = jwt.encode(
              {"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              key, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.jkeroro.Kero&fields[apps]=name,bundleId",
                                       headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req) as r:
                  apps = json.load(r)["data"]
                  if apps:
                      print(f"::notice title=App Store Connect::Key works. Found app record '{apps[0]['attributes']['name']}'.")
                  else:
                      print("::error title=App Store Connect::Key works, but there's no app with bundle ID com.jkeroro.Kero. Create it in App Store Connect first.")
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              detail = "; ".join(err.get("detail", "") for err in json.loads(body).get("errors", [])) if body.startswith("{") else body[:300]
              print(f"::error title=App Store Connect API {e.code}::{detail} — check that ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 belong to the same Team key (Users and Access → Integrations → Team Keys).")
          PY

      - name: Set up
        run: |
          git config --global url."https://x-access-token:${ENGINE_TOKEN}@github.com/".insteadOf "https://github.com/"
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          brew install xcodegen
          xcodegen

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          sed "s/__TEAM_ID__/${APPLE_TEAM_ID}/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          mkdir -p build
          xcodebuild archive \
            -project Kero.xcodeproj -scheme Kero -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Kero.xcarchive \
            -derivedDataPath build/DerivedData \
            -scmProvider system \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > build/archive.log 2>&1 || true
          ERRORS="$(grep -E "error: |error:" build/archive.log | sed "s#$GITHUB_WORKSPACE/##" | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
          if [ -n "$ERRORS" ]; then echo "::error title=Archive errors::$ERRORS"; fi
          grep -q "ARCHIVE SUCCEEDED" build/archive.log || { tail -80 build/archive.log; exit 1; }

      # Export the signed .ipa locally, then upload it with altool. (Xcode's built-in
      # "destination: upload" path fails to authenticate API keys on Xcode 26.6.)
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Kero.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > build/export.log 2>&1 || true
          ERRORS="$(grep -iE "error" build/export.log | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
          if [ -n "$ERRORS" ]; then echo "::error title=Export errors::$ERRORS"; fi
          ls build/export/*.ipa >/dev/null 2>&1 || { tail -60 build/export.log; exit 1; }

      - name: Upload to App Store Connect
        run: |
          # altool looks for the key in ~/.appstoreconnect/private_keys.
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$KEY_PATH" ~/.appstoreconnect/private_keys/
          IPA="$(ls build/export/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal \
            > build/upload.log 2>&1 || true
          cat build/upload.log | tail -40
          ERRORS="$(grep -iE "error|fail" build/upload.log | sort -u | head -40 | awk '{printf "%s%%0A", $0}')"
          if grep -qiE "UPLOAD SUCCEEDED|No errors uploading" build/upload.log; then
            echo "::notice title=Uploaded::Build ${{ github.run_number }} is processing in App Store Connect. It shows up in TestFlight in about 10–30 minutes."
          else
            echo "::error title=Upload errors::$ERRORS"
            exit 1
          fi
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8

      - name: Clean up key
        if: always()
        run: rm -f "$KEY_PATH"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore
